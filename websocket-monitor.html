<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube AI Platform - Live Status Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .status-bar {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.disconnected {
            background: #dc3545;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .user-id {
            font-size: 12px;
            color: #6c757d;
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
        }

        .controls {
            padding: 20px 30px;
            background: #fff;
            border-bottom: 1px solid #dee2e6;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-clear {
            background: #dc3545;
            color: white;
        }

        .btn-clear:hover {
            background: #c82333;
        }

        .logs-container {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid;
            background: #f8f9fa;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry.PROCESSING {
            border-left-color: #ffc107;
            background: #fff9e6;
        }

        .log-entry.COMPLETED {
            border-left-color: #28a745;
            background: #e7f7ed;
        }

        .log-entry.FAILED {
            border-left-color: #dc3545;
            background: #fde7e9;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .log-type {
            font-weight: 700;
            font-size: 14px;
            color: #495057;
        }

        .log-time {
            font-size: 12px;
            color: #6c757d;
            font-family: 'Courier New', monospace;
        }

        .log-details {
            font-size: 13px;
            color: #495057;
            line-height: 1.6;
        }

        .log-details strong {
            color: #212529;
        }

        .summary-preview {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            font-size: 12px;
        }

        .summary-preview h4 {
            margin-bottom: 5px;
            color: #495057;
        }

        .key-points {
            margin-top: 8px;
            padding-left: 20px;
        }

        .key-points li {
            margin-bottom: 4px;
            color: #6c757d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.PROCESSING {
            background: #ffc107;
            color: #856404;
        }

        .badge.COMPLETED {
            background: #28a745;
            color: white;
        }

        .badge.FAILED {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube AI Platform - Live Monitor</h1>
            <p>Real-time WebSocket updates for video processing</p>
        </div>

        <div class="status-bar">
            <div class="connection-status">
                <div class="status-dot disconnected" id="statusDot"></div>
                <span id="connectionText">Connecting...</span>
            </div>
            <div class="user-id">User ID: cmp2x4cmv0000wxhcar461j2a</div>
        </div>

        <div class="controls">
            <button class="btn btn-clear" onclick="clearLogs()">Clear Logs</button>
        </div>

        <div class="logs-container" id="logsContainer">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                </svg>
                <h3>Waiting for events...</h3>
                <p>Submit a video URL in Postman to see live updates here</p>
            </div>
        </div>
    </div>

    <script>
        const USER_ID = 'cmp2x4cmv0000wxhcar461j2a';
        let ws = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;

        function connectWebSocket() {
            console.log('%c🔌 Connecting to WebSocket...', 'color: #667eea; font-weight: bold; font-size: 14px');

            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                reconnectAttempts = 0;
                document.getElementById('statusDot').className = 'status-dot connected';
                document.getElementById('connectionText').textContent = 'Connected to Socket Service';
                console.log('%c✅ WebSocket Connected!', 'color: #28a745; font-weight: bold; font-size: 14px');

                // Register user with the socket service
                ws.send(JSON.stringify({
                    type: 'REGISTER',
                    userId: USER_ID
                }));
                console.log('%c📝 Registered user:', 'color: #667eea; font-weight: bold', USER_ID);

                // Remove empty state
                const emptyState = document.querySelector('.empty-state');
                if (emptyState && document.querySelectorAll('.log-entry').length > 0) {
                    emptyState.remove();
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('%c📨 WebSocket Message:', 'color: #667eea; font-weight: bold', data);

                    // Filter messages for this user
                    if (data.userId === USER_ID) {
                        displayLog(data);
                    } else {
                        console.log('%c⏭️  Message for different user, skipping...', 'color: #6c757d');
                    }
                } catch (error) {
                    console.error('Failed to parse message:', error);
                }
            };

            ws.onerror = (error) => {
                console.error('%c❌ WebSocket Error:', 'color: #dc3545; font-weight: bold', error);
                document.getElementById('statusDot').className = 'status-dot disconnected';
                document.getElementById('connectionText').textContent = 'Connection Error';
            };

            ws.onclose = () => {
                console.log('%c🔌 WebSocket Disconnected', 'color: #ffc107; font-weight: bold');
                document.getElementById('statusDot').className = 'status-dot disconnected';
                document.getElementById('connectionText').textContent = 'Disconnected';

                // Attempt to reconnect
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                    console.log(`%c🔄 Reconnecting in ${delay/1000}s (attempt ${reconnectAttempts})...`, 'color: #ffc107');
                    setTimeout(connectWebSocket, delay);
                }
            };
        }

        function displayLog(data) {
            const container = document.getElementById('logsContainer');

            // Remove empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${data.status || ''}`;

            const timestamp = new Date().toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            let detailsHTML = '';

            // Handle different event types
            if (data.type === 'SUMMARY_STATUS') {
                detailsHTML = `
                    <div class="log-header">
                        <div class="log-type">
                            📊 Summary Generation
                            <span class="badge ${data.status}">${data.status}</span>
                        </div>
                        <div class="log-time">${timestamp}</div>
                    </div>
                    <div class="log-details">
                        <strong>Video ID:</strong> ${data.videoId}<br>
                        <strong>Status:</strong> ${data.status}
                        ${data.error ? `<br><strong>Error:</strong> <span style="color: #dc3545">${data.error}</span>` : ''}
                    </div>
                `;

                if (data.summary && data.status === 'COMPLETED') {
                    try {
                        const summary = typeof data.summary === 'string' ? JSON.parse(data.summary) : data.summary;
                        detailsHTML += `
                            <div class="summary-preview">
                                <h4>📝 ${summary.title || 'Summary Generated'}</h4>
                                <p style="margin-top: 8px; color: #495057;">${summary.shortSummary || ''}</p>
                                ${summary.keyPoints && summary.keyPoints.length > 0 ? `
                                    <ul class="key-points">
                                        ${summary.keyPoints.map(point => `<li>${point}</li>`).join('')}
                                    </ul>
                                ` : ''}
                            </div>
                        `;
                    } catch (e) {
                        console.error('Failed to parse summary:', e);
                    }
                }
            } else if (data.type === 'DOWNLOAD_STATUS') {
                detailsHTML = `
                    <div class="log-header">
                        <div class="log-type">
                            ⬇️ Video Download
                            <span class="badge ${data.status}">${data.status}</span>
                        </div>
                        <div class="log-time">${timestamp}</div>
                    </div>
                    <div class="log-details">
                        <strong>Video ID:</strong> ${data.videoId}<br>
                        <strong>Status:</strong> ${data.status}
                        ${data.error ? `<br><strong>Error:</strong> <span style="color: #dc3545">${data.error}</span>` : ''}
                    </div>
                `;
            } else if (data.type === 'TRANSCRIPT_STATUS') {
                detailsHTML = `
                    <div class="log-header">
                        <div class="log-type">
                            📝 Transcription
                            <span class="badge ${data.status}">${data.status}</span>
                        </div>
                        <div class="log-time">${timestamp}</div>
                    </div>
                    <div class="log-details">
                        <strong>Video ID:</strong> ${data.videoId}<br>
                        <strong>Status:</strong> ${data.status}
                        ${data.error ? `<br><strong>Error:</strong> <span style="color: #dc3545">${data.error}</span>` : ''}
                    </div>
                `;
            } else {
                // Generic message
                detailsHTML = `
                    <div class="log-header">
                        <div class="log-type">
                            📡 ${data.type || 'Event'}
                            ${data.status ? `<span class="badge ${data.status}">${data.status}</span>` : ''}
                        </div>
                        <div class="log-time">${timestamp}</div>
                    </div>
                    <div class="log-details">
                        <pre style="white-space: pre-wrap; word-wrap: break-word;">${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            }

            logEntry.innerHTML = detailsHTML;
            container.insertBefore(logEntry, container.firstChild);

            // Console log with emoji
            const emoji = data.status === 'COMPLETED' ? '✅' :
                         data.status === 'PROCESSING' ? '⚙️' :
                         data.status === 'FAILED' ? '❌' : '📡';
            console.log(`%c${emoji} ${data.type}: ${data.status}`, `color: ${
                data.status === 'COMPLETED' ? '#28a745' :
                data.status === 'PROCESSING' ? '#ffc107' :
                data.status === 'FAILED' ? '#dc3545' : '#667eea'
            }; font-weight: bold`, data);
        }

        function clearLogs() {
            const container = document.getElementById('logsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                    </svg>
                    <h3>Waiting for events...</h3>
                    <p>Submit a video URL in Postman to see live updates here</p>
                </div>
            `;
            console.clear();
            console.log('%c🧹 Logs cleared!', 'color: #667eea; font-weight: bold; font-size: 14px');
        }

        // Connect on page load
        connectWebSocket();

        // Log instructions
        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #667eea');
        console.log('%c🎬 YouTube AI Platform - WebSocket Monitor', 'color: #667eea; font-weight: bold; font-size: 16px');
        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #667eea');
        console.log('%cMonitoring User ID: cmp2x4cmv0000wxhcar461j2a', 'color: #495057');
        console.log('%cWebSocket URL: ws://localhost:8080', 'color: #495057');
        console.log('%c\n📝 Instructions:', 'color: #667eea; font-weight: bold; font-size: 14px');
        console.log('1. Make sure Socket Service is running (port 8080)');
        console.log('2. Submit a video URL in Postman with your user token');
        console.log('3. Watch this page for live updates!');
        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n', 'color: #667eea');
    </script>
</body>
</html>
